name: mdm-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page to download through Mister Download Manager"
        required: true

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg xvfb > /dev/null
      - name: Install Mister Download Manager
        run: bash mdm/setup.sh
      - name: Install browser driver
        working-directory: mdm
        run: npm ci --no-audit --no-fund --silent
      - name: Download through the extension
        working-directory: mdm
        env:
          PAGE_URL: ${{ inputs.url }}
          MDM_SHOTS: ${{ runner.temp }}
        run: |
          xvfb-run -a node grab.mjs "$PAGE_URL" "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/grab.log"
          F=$(tail -1 "$RUNNER_TEMP/grab.log" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("path") or sys.exit(d.get("error")))')
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of compact "$F"
      - name: Diagnostics
        if: always()
        run: |
          D="$HOME/mdm/data"
          echo "extension-seen: $(cat "$D/extension-seen" 2>/dev/null)"
          tail -n 40 "$D/logs/mdm.log" 2>/dev/null | cut -c1-300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-shots
          path: ${{ runner.temp }}/*.png
          retention-days: 3
          if-no-files-found: ignore
