name: mdm-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page to download through Mister Download Manager"
        required: true

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          # Only what the runner image lacks; apt's index is refreshed only when needed.
          need=""; for c in ffmpeg xvfb xdotool; do b=$c; [ $c = xvfb ] && b=Xvfb; command -v $b >/dev/null || need="$need $c"; done
          if [ -n "$need" ]; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get install -y -qq --no-install-recommends $need > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $need > /dev/null; }
          fi
      - name: Network speed
        run: |
          down=$(curl -s -o /dev/null -w '%{speed_download}' --max-time 30 'https://speed.cloudflare.com/__down?bytes=100000000')
          head -c 50000000 /dev/zero > /tmp/up.bin
          up=$(curl -s -o /dev/null -w '%{speed_upload}' --max-time 30 -X POST --data-binary @/tmp/up.bin 'https://speed.cloudflare.com/__up')
          python3 -c "import sys; d,u=map(float,sys.argv[1:]); print(f'SPEED download {d*8/1e6:.0f} Mbps ({d/1048576:.1f} MB/s) | upload {u*8/1e6:.0f} Mbps ({u/1048576:.1f} MB/s)')" "$down" "$up"
      - name: Install Mister Download Manager
        run: bash mdm/setup.sh
      - name: Install browser driver
        working-directory: mdm
        run: npm ci --no-audit --no-fund --silent
      - name: Download through the extension
        working-directory: mdm
        env:
          PAGE_URL: ${{ inputs.url }}
          MDM_SHOTS: ${{ runner.temp }}
        run: |
          xvfb-run -a node grab.mjs "$PAGE_URL" "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/grab.log"
          F=$(tail -1 "$RUNNER_TEMP/grab.log" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("path") or sys.exit(d.get("error")))')
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of compact "$F"
      - name: Diagnostics
        if: always()
        run: |
          D="$HOME/mdm/data"
          echo "extension-seen: $(cat "$D/extension-seen" 2>/dev/null)"
          grep -v "usvg\|zbus\|XSETTINGS\|portal" "$D/logs/mdm.log" 2>/dev/null | tail -n 60 | cut -c1-400 || true
          echo "--- video-info"
          MDM_DATA_DIR="$D" timeout 120 misterdownloadmanager-cli video-info "${{ inputs.url }}" 2>&1 | cut -c1-600 | head -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-shots
          path: ${{ runner.temp }}/*.png
          retention-days: 3
          if-no-files-found: ignore
