name: mdm-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page(s) to download through Mister Download Manager, one after another (space-separated), the way the worker does"
        required: true

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install tools
        run: |
          # Only what the runner image lacks; apt's index is refreshed only when needed.
          need=""; for c in ffmpeg xvfb xdotool; do b=$c; [ $c = xvfb ] && b=Xvfb; command -v $b >/dev/null || need="$need $c"; done
          if [ -n "$need" ]; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get install -y -qq --no-install-recommends $need > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $need > /dev/null; }
          fi
      - name: Network speed
        run: |
          down=$(curl -s -o /dev/null -w '%{speed_download}' --max-time 30 'https://proof.ovh.net/files/100Mb.dat')
          head -c 50000000 /dev/zero > /tmp/up.bin
          up=$(curl -s -o /dev/null -w '%{speed_upload}' --max-time 30 -X POST --data-binary @/tmp/up.bin 'https://speed.cloudflare.com/__up')
          python3 -c "import sys; d,u=map(float,sys.argv[1:]); print(f'SPEED download {d*8/1e6:.0f} Mbps ({d/1048576:.1f} MB/s) | upload {u*8/1e6:.0f} Mbps ({u/1048576:.1f} MB/s)')" "$down" "$up"
      - name: Install Mister Download Manager
        run: bash mdm/setup.sh
      - name: Install browser driver
        working-directory: mdm
        run: npm ci --no-audit --no-fund --silent
      - name: Download through the extension
        working-directory: mdm
        env:
          PAGE_URLS: ${{ inputs.url }}
        run: |
          # Each page in its own folder and screenshot folder, the folder removed after it (as the
          # worker does); MDM's processes listed between pages.
          set -f  # page addresses are split on spaces only, never expanded as file patterns
          n=0; fail=0
          for u in $PAGE_URLS; do
            n=$((n+1)); export MDM_SHOTS="$RUNNER_TEMP/shots/$n"; mkdir -p "$MDM_SHOTS"
            echo "::group::page $n"
            xvfb-run -a -s "-screen 0 2400x1000x24" node grab.mjs "$u" "$RUNNER_TEMP/out/$n" 2> "$MDM_SHOTS/grab.log" | tail -1 | tee "$MDM_SHOTS/result.json"
            cat "$MDM_SHOTS/grab.log"
            F=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("path",""))' "$MDM_SHOTS/result.json")
            if [ -n "$F" ]; then ffprobe -v error -show_entries format=duration,size -of compact "$F"; else fail=1; fi
            echo "::endgroup::"
            echo "--- MDM processes left after page $n:"; pgrep -af -i misterdownload || echo "(none)"
            rm -rf "$RUNNER_TEMP/out/$n"
          done
          exit $fail

      - name: Diagnostics
        if: always()
        env:
          PAGE_URLS: ${{ inputs.url }}
        run: |
          D="$HOME/mdm/data"
          echo "extension-seen: $(cat "$D/extension-seen" 2>/dev/null)"
          grep -v "usvg\|zbus\|XSETTINGS\|portal" "$D/logs/mdm.log" 2>/dev/null | tail -n 60 | cut -c1-400 || true
          echo "--- video-info"
          MDM_DATA_DIR="$D" timeout 120 misterdownloadmanager-cli video-info "${PAGE_URLS%% *}" 2>&1 | cut -c1-600 | head -20 || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: probe-shots
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: ignore
