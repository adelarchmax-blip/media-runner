name: runner

on:
  workflow_dispatch:

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg rclone xvfb > /dev/null
          pip install -q -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mister Download Manager
        run: |
          bash mdm/setup.sh
          cd mdm && npm ci --no-audit --no-fund --silent

      - name: Configure rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: python setup_rclone.py

      - name: Process jobs
        env:
          RUNNER_API_URL: ${{ secrets.RUNNER_API_URL }}
          RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          MEDIA_BASE_PATH: ${{ secrets.MEDIA_BASE_PATH }}
          RUN_ID: ${{ github.run_id }}
        run: python worker.py
