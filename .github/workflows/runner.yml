name: runner

on:
  workflow_dispatch:

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUNNER_API_URL: ${{ secrets.RUNNER_API_URL }}
      RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Report start
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV" && RUN_STARTED=$(date +%s) sh stage.sh booting

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install tools
        run: |
          sh stage.sh installing
          # Only what the runner image lacks; apt's index is refreshed only when needed.
          need=""; for c in ffmpeg rclone xvfb xdotool; do b=$c; [ $c = xvfb ] && b=Xvfb; command -v $b >/dev/null || need="$need $c"; done
          if [ -n "$need" ]; then
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get install -y -qq --no-install-recommends $need > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $need > /dev/null; }
          fi
          pip install -q -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mister Download Manager
        run: |
          sh stage.sh downloader
          bash mdm/setup.sh
          cd mdm && npm ci --no-audit --no-fund --silent

      - name: Configure rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: python setup_rclone.py

      - name: Start picture search
        # SearXNG (pinned image) asks many search engines at once; the poster engine uses it only
        # when a work has no picture on its site, its encyclopedia article or IMDb.
        continue-on-error: true
        run: |
          sh stage.sh search
          docker run -d --name searxng -p 127.0.0.1:8888:8080 \
            -e SEARXNG_SECRET="$(openssl rand -hex 32)" \
            -v "$GITHUB_WORKSPACE/search/settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:2026.11.18-b867c56a5@sha256:6012a064924a032969a2e7989d66971803f126a237a2fb6c62f10ae3d82093e1 > /dev/null

      - name: Process jobs
        env:
          SEARX_URL: http://127.0.0.1:8888
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          MEDIA_BASE_PATH: ${{ secrets.MEDIA_BASE_PATH }}
        run: python worker.py
