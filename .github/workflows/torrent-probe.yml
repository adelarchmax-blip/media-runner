name: torrent-probe

# Downloads one torrent through Mister Download Manager's own torrent engine and reports what
# happened: the torrent's files, the file picked, speed, peers, time, disk use, and whether the
# result is a real video. Seeding is not done: the command stops when the file is complete.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Up to 6 magnet links or https .torrent addresses, separated by spaces (tried one after another)"
        required: true
      minutes:
        description: "Give up after this many minutes"
        required: false
        default: "40"

concurrency:
  group: media-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Check the input
        env:
          SOURCE: ${{ inputs.source }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          # Only a magnet link or an https .torrent address, nothing that a shell could read.
          python3 - <<'EOF'
          import os, re, sys
          items, m = os.environ["SOURCE"].split(), os.environ["MINUTES"].strip()
          def ok(s):
              if re.fullmatch(r"magnet:\?[A-Za-z0-9%:=&._+\-/]+", s):
                  return re.search(r"xt=urn:btih:([0-9a-fA-F]{40}|[A-Za-z2-7]{32})", s)
              # an https .torrent address; a query (?type=torrent&file=x.torrent) is allowed
              return re.fullmatch(r"https?://[A-Za-z0-9.\-]+(/[A-Za-z0-9%._~\-/]*)?(\?[A-Za-z0-9%._~\-=&]*)?", s) and ".torrent" in s
          if not 1 <= len(items) <= 6 or not all(ok(s) for s in items) or not re.fullmatch(r"[1-9][0-9]?", m):
              sys.exit("source: 1-6 magnet links or .torrent addresses; minutes 1-99")
          EOF
      - name: Install ffprobe
        run: |
          command -v ffprobe >/dev/null || { sudo rm -f /var/lib/man-db/auto-update; sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; }; }
      - name: Disk before
        run: df -h / "$RUNNER_TEMP" | tail -n +1
      - name: Install Mister Download Manager
        run: bash mdm/setup.sh
      - name: Torrent through the runner's own download path
        env:
          SOURCES: ${{ inputs.source }}
          MINUTES: ${{ inputs.minutes }}
          # worker.py needs these to load; the probe reports to no one and uploads nothing
          RUNNER_API_URL: http://127.0.0.1:9
          RUNNER_API_TOKEN: none
          RCLONE_REMOTE: none
          MEDIA_BASE_PATH: none
        run: |
          set -o pipefail
          python3 - <<'EOF'
          import hashlib, logging, os, shutil, subprocess, sys, time
          import requests
          sys.path.insert(0, os.getcwd())
          import worker
          worker.api = lambda *a, **k: {}          # no controller here
          logging.basicConfig(level=logging.INFO, format="[%(levelname)s] %(message)s")
          minutes, oks, items = int(os.environ["MINUTES"]), 0, os.environ["SOURCES"].split()
          for n, src in enumerate(items, 1):
              print(f"=================== torrent {n}", flush=True)
              job = os.path.join(os.environ["RUNNER_TEMP"], f"torrent{n}")
              os.makedirs(job, exist_ok=True)
              try:
                  if src.startswith("magnet:"):
                      item = {"id": n, "watch_url": src}
                  else:                            # the magnet is built from the file's own hash
                      with requests.get(src, headers=worker._BROWSER_UA, timeout=30, stream=True) as r:
                          r.raise_for_status()
                          data = r.raw.read(worker.MAX_TORRENT_FILE + 1, decode_content=True)
                      if len(data) > worker.MAX_TORRENT_FILE:
                          raise RuntimeError("the .torrent file is too big")
                      _, (a, b) = worker._bdecode(data)
                      item = {"id": n, "torrent_url": src,
                              "watch_url": "magnet:?xt=urn:btih:" + hashlib.sha1(data[a:b]).hexdigest()}
                  worker.START, worker.MAX_SECONDS = time.time(), (minutes + 15) * 60 + 30
                  start = time.time()
                  path, subs = worker.download_torrent(item, os.path.join(job, "film"), worker.Progress(n))
                  secs, size = max(time.time() - start, 1), os.path.getsize(path)
                  print(f"RESULT done in {secs:.0f}s | {size / 1048576:.0f} MB | avg {size / 1048576 / secs:.1f} MB/s | {len(subs)} subtitle(s)")
                  subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration,size:stream=codec_type,codec_name,width,height",
                                  "-of", "compact", path], check=False)
                  oks += 1
              except Exception as e:
                  print(f"RESULT failed: {worker._URL.sub('<address>', str(e))[:200]}")
              finally:
                  worker.free_disk(n)
                  shutil.rmtree(job, ignore_errors=True)
          print("--- MDM processes left (should be none, no seeding):", flush=True)
          if subprocess.run(["pgrep", "-af", "-i", "misterdownload"]).returncode:
              print("(none)")
          print(f"SUMMARY {oks} of {len(items)} downloaded and checked")
          sys.exit(0 if oks else 1)
          EOF
          echo "--- disk after:"; df -h / "$RUNNER_TEMP"
