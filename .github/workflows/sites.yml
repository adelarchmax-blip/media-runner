name: sites

# The light runner for site work: torrent-site scans, section maps and life checks in real Google Chrome
# with uBlock Origin Lite + AdBlocker Ultimate. n8n starts it when site jobs wait. It has its own machine
# and its own group, so it runs beside the download runner without touching it. No download tools are
# set up here; it is ready in about a minute and waits a few minutes for new jobs before it ends.
# Nothing here names a site.
on:
  workflow_dispatch:

concurrency:
  group: media-sites
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      RUNNER_API_URL: ${{ secrets.RUNNER_API_URL }}
      RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      SITES_PROFILE: ${{ github.workspace }}/../sites-chrome
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sites/requirements.txt

      - name: Week number
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # Only the ad blockers' own files are kept between runs (sign-ins never are), so Chrome does not
      # download them again; they are refreshed every week.
      - uses: actions/cache@v4
        with:
          path: ${{ env.SITES_PROFILE }}/Default/Extensions
          key: sites-blockers-${{ steps.week.outputs.week }}

      - name: Install tools
        run: |
          command -v Xvfb >/dev/null || { sudo rm -f /var/lib/man-db/auto-update; sudo apt-get install -y -qq --no-install-recommends xvfb > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb > /dev/null; }; }
          pip install -q -r sites/requirements.txt

      - name: Site jobs
        run: python sites_runner.py
