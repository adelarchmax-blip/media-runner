# SearXNG, run on the runner only while it works, for picture searches across many engines at
# once (the poster engine's last online source). Listens on the runner's loopback only.
use_default_settings: true
general:
  instance_name: "media-runner"
server:
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 1
  formats:
    - html
    - json
# Picture engines asked for every poster search (the fastest ones first). Each search logs how many
# results each engine gave and which ones did not answer, without the work's name.
engines:
  - name: google images
    disabled: false
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: qwant images
    disabled: false
